<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia del Arte - Evaluación 4</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Historia del Arte</h1>
            <p>Evaluación 4 - Refactorización Modular</p>
        </header>

        <div class="multimedia-box">
            <h2>🎵 Control de Audio</h2>
            <audio id="audioPlayer" controls>
                <source src="https://assets.mixkit.co/music/preview/mixkit-a-very-style-piano-118.mp3" type="audio/mpeg">
            </audio>
            <div class="controls">
                <button onclick="AudioController.play()">▶️ Play</button>
                <button onclick="AudioController.pause()">⏸️ Pause</button>
                <button onclick="AudioController.stop()">⏹️ Stop</button>
            </div>
        </div>

        <div class="multimedia-box">
            <h2>🌈 Efectos Visuales</h2>
            <div class="color-box" id="colorBox">Texto para efectos</div>
            <div class="controls">
                <button onclick="EffectsController.changeColor()">Cambiar Color</button>
                <button onclick="EffectsController.activateTimeout()">Activar Timeout</button>
            </div>
        </div>

        <div class="evaluation-section">
            <h2>🔧 Evaluación 4 - try...catch</h2>
            <div class="controls">
                <button onclick="ErrorHandler.testTryCatch()">Probar try...catch</button>
                <button onclick="ErrorHandler.testPromise()">Error en Promesa</button>
            </div>
            <div class="console" id="consoleOutput">Consola...</div>
        </div>

        <footer>
            <p>Evaluación 4 - Manejo de Errores y Módulos</p>
        </footer>
    </div>

    <script src="js/audio-controller.js"></script>
    <script src="js/effects-controller.js"></script>
    <script src="js/error-handler.js"></script>
</body>
</html>
